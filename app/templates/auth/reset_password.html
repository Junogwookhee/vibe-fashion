{% extends 'base.html' %}

{% block title %}새 비밀번호 설정 | VIBE-FASHION{% endblock %}

{% block content %}
<section class="py-5 bg-surface" style="min-height: 80vh;">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <!-- Bootstrap 5 Alert 컴포넌트: 에러 메시지 -->
                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show rounded-4 mb-4 shadow-sm" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div><strong>{{ error_msg }}</strong></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px; border-radius: 50%; background: rgba(244, 63, 94, 0.1); color: var(--brand-coral);">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h2 class="fw-bold letter-spacing-1 text-dark mb-1">SET NEW PASSWORD</h2>
                        <p class="text-muted small">새로 사용할 안전한 비밀번호를 입력해주세요</p>
                    </div>

                    <form action="{{ url_for('auth.reset_password') }}" method="POST" id="resetPasswordForm">
                        <input type="hidden" name="access_token" id="hiddenAccessToken" value="">

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-bold small text-dark">새 비밀번호 *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-light-subtle"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-light-subtle py-2" id="newPassword" name="password" placeholder="6자리 이상 비밀번호 입력" minlength="6" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="newPasswordConfirm" class="form-label fw-bold small text-dark">새 비밀번호 확인 *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-light-subtle"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control bg-light border-light-subtle py-2" id="newPasswordConfirm" name="password_confirm" placeholder="새 비밀번호 재입력" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold shadow-sm mb-3">
                            비밀번호 변경 완료
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top border-light-subtle">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>로그인 화면으로 이동
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Supabase Hash Fragment Token 지원 스크립트 -->
<script>
    if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        if (accessToken) {
            const tokenInput = document.getElementById('hiddenAccessToken');
            if (tokenInput) tokenInput.value = accessToken;
        }
    }
</script>
{% endblock %}
