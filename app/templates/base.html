<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VIBE-FASHION{% endblock %}</title>

    <!-- Bootstrap 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 커스텀 스타일시트 연결 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- 내비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold tracking-wider" href="{{ url_for('main.index') }}">
                <i class="bi bi-bag-heart-fill me-2 text-danger"></i>VIBE-FASHION
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('main.index') }}">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#products">신상품</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">브랜드 소개</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-light btn-sm px-3 position-relative" href="#" role="button" id="cartNavBtn">
                            <i class="bi bi-cart3 me-1"></i>장바구니
                            <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Toast 알림 컨테이너 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="cartToast" class="toast align-items-center text-bg-dark border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill text-success fs-5"></i>
                    <div>
                        <strong id="toastItemName" class="text-white"></strong> 상품이 장바구니에 담겼습니다!
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 영역 -->
    <footer class="bg-dark text-white-50 py-5 mt-5 border-top border-secondary">
        <div class="container text-center">
            <h5 class="text-white fw-bold mb-3">VIBE-FASHION</h5>
            <p class="mb-2">트렌디하고 감각적인 패션을 제안하는 라이프스타일 셀렉트샵</p>
            <small>&copy; 2026 VIBE-FASHION. All rights reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap 5.3 CDN JS (번들) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- 장바구니 상호작용 스크립트 -->
    <script>
        let cartCount = 0;
        function addToCart(itemName) {
            cartCount++;
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = cartCount;
                badge.classList.remove('d-none');
                badge.classList.add('animate__animated', 'animate__pulse');
            }

            const toastElem = document.getElementById('cartToast');
            const toastName = document.getElementById('toastItemName');
            if (toastElem && toastName) {
                toastName.textContent = itemName;
                const toast = bootstrap.Toast.getOrCreateInstance(toastElem, { delay: 3000 });
                toast.show();
            }
        }
    </script>
</body>
</html>
